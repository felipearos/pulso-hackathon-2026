# Adapted from Loggd: serial Mergify queue, squash, five PRs per batch.

merge_queue:
  max_parallel_checks: 1
  mode: serial
  status_comments: outcomes
  queued_label: queued
  dequeued_label: dequeued

queue_rules:
  - name: main
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - check-success = buildkite/pulso-hackathon-2026
    merge_conditions:
      - check-success = buildkite/pulso-hackathon-2026
    merge_method: squash
    batch_size: 5
    batch_max_wait_time: 3 min
    batch_max_failure_resolution_attempts: 3
    checks_timeout: 60 min

# Mergify only queues by itself through Merge Protections' auto-merge on this
# repository: the pull_request_rules below never run here (no Summary check,
# and a ready-to-merge label queued nothing). The conditions are the same
# policy: a settled PR (no open review thread, thirty minutes for Codex to
# post) or one labelled ready-to-merge, never one on hold. The queue's own
# conditions still demand green Buildkite before anything merges.
merge_protections_settings:
  auto_merge_conditions:
    - label != hold
    - "#changes-requested-reviews-by = 0"
    - or:
        - label = ready-to-merge
        - and:
            - "#review-threads-unresolved = 0"
            - created-at < 30 minutes ago

pull_request_rules:
  - name: queue a settled green PR
    conditions:
      - -draft
      - -closed
      - label != hold
      - "#review-threads-unresolved = 0"
      - "#changes-requested-reviews-by = 0"
      - created-at < 30 minutes ago
    actions:
      queue:

  - name: queue on the ready-to-merge label
    conditions:
      - label = ready-to-merge
      - label != hold
    actions:
      queue:

  - name: clear the handoff after the merge
    conditions:
      - merged
      - label = ready-to-merge
    actions:
      label:
        remove:
          - ready-to-merge
