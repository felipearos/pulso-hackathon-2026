<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna · pronto</title>
<meta name="description" content="Esto está por llegar. Luna te avisa pronto.">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2096%2096%22%3E%3Crect%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2226%22%20fill%3D%22%23232E78%22%2F%3E%3Cdefs%3E%3Cmask%20id%3D%22f%22%3E%3Crect%20width%3D%2296%22%20height%3D%2296%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2256%22%20cy%3D%2231%22%20r%3D%2212%22%20fill%3D%22%23000%22%2F%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M19%2050%20L48%2028%20L77%2050%22%20fill%3D%22none%22%20stroke%3D%22%23FBF8F1%22%20stroke-width%3D%224.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2238.5%22%20r%3D%2216%22%20fill%3D%22%23F2B33D%22%20mask%3D%22url(%23f)%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2250%22%20width%3D%2258%22%20height%3D%2227%22%20rx%3D%226%22%20fill%3D%22%23232E78%22%20stroke%3D%22%23FBF8F1%22%20stroke-width%3D%224.5%22%2F%3E%3Cpath%20d%3D%22M22%2074.5%20L48%2059%20L74%2074.5%22%20fill%3D%22none%22%20stroke%3D%22%23FBF8F1%22%20stroke-width%3D%223.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.5%22%2F%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FBF8F1;
  --surface: #F3EDE1;
  --ink: #17181C;
  --ink-2: #45474F;
  --night: #232E78;
  --night-deep: #141D4A;
  --moon: #F2B33D;
  --moon-soft: #FBEFD2;
  --on-night: #FFFFFF;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.5;
}
:focus-visible { outline: 3px solid var(--night); outline-offset: 3px; border-radius: 6px; }
.top { display: flex; align-items: center; min-height: 64px; padding: 0 16px; max-width: 1080px; width: 100%; margin: 0 auto; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-height: 44px; }
.brand svg { width: 36px; height: 36px; }
.brand span { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; text-transform: lowercase; color: var(--night); }
main { display: grid; place-items: center; padding: 32px 16px 64px; text-align: center; }
.moon-wrap { width: 112px; height: 112px; margin: 0 auto 28px; border-radius: 50%; background: var(--night-deep); display: grid; place-items: center; box-shadow: 0 0 0 12px var(--moon-soft); }
.moon-wrap svg { width: 56px; height: 56px; animation: glow 6s ease-in-out infinite; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 9vw, 52px); line-height: 1.15; letter-spacing: -0.015em; margin: 0; }
p { margin: 14px 0 0; font-size: 20px; color: var(--ink-2); }
.back {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 32px;
  min-height: 56px; padding: 0 28px; border-radius: 999px; background: var(--night); color: var(--on-night);
  text-decoration: none; font: 600 19px/1.2 var(--f-body);
}
.back:hover { background: var(--night-deep); }
.back svg { width: 20px; height: 20px; }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 2px rgba(232, 166, 35, .4)); } 50% { filter: drop-shadow(0 0 10px rgba(232, 166, 35, .8)); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <mask id="crescent">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="21" cy="11" r="10" fill="#000"/>
    </mask>
    <mask id="logo-crescent"><rect width="96" height="96" fill="#fff"/><circle cx="56" cy="31" r="12" fill="#000"/></mask>
    <!-- Luna's logo, the open envelope with the moon rising (src/web/marca.ts draws the same). -->
    <symbol id="logo" viewBox="0 0 96 96"><rect width="96" height="96" rx="26" fill="#232E78"/><path d="M19 50 L48 28 L77 50" fill="none" stroke="#FBF8F1" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="46" cy="38.5" r="16" fill="#F2B33D" mask="url(#logo-crescent)"/><rect x="19" y="50" width="58" height="27" rx="6" fill="#232E78" stroke="#FBF8F1" stroke-width="4.5"/><path d="M22 74.5 L48 59 L74 74.5" fill="none" stroke="#FBF8F1" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="logo-avatar" viewBox="0 0 96 96"><rect width="96" height="96" fill="#232E78"/><g transform="translate(48 51) scale(.84) translate(-48 -51)"><path d="M19 50 L48 28 L77 50" fill="none" stroke="#FBF8F1" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="46" cy="38.5" r="16" fill="#F2B33D" mask="url(#logo-crescent)"/><rect x="19" y="50" width="58" height="27" rx="6" fill="#232E78" stroke="#FBF8F1" stroke-width="4.5"/><path d="M22 74.5 L48 59 L74 74.5" fill="none" stroke="#FBF8F1" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/></g></symbol>
    <symbol id="moon" viewBox="0 0 32 32"><circle cx="15" cy="17" r="13" fill="currentColor" mask="url(#crescent)"/></symbol>
  </defs>
</svg>
<header class="top">
  <a class="brand" href="/" aria-label="Luna, inicio">
    <svg aria-hidden="true" focusable="false"><use href="#logo"/></svg>
    <span>Luna</span>
  </a>
</header>
<main>
  <div>
    <div class="moon-wrap"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false" style="color:var(--moon)"><use href="#moon"/></svg></div>
    <h1>Esto está por llegar.</h1>
    <p>Luna te avisa pronto.</p>
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Volver al inicio
    </a>
  </div>
</main>
</body>
</html>
