<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 48px;
    background: #0b0b0d;
    color: #f5f5f5;
    font: 26px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 40px; margin: 0 0 8px; }
  h2 { font-size: 32px; margin: 40px 0 16px; }
  #reloj { font-size: 72px; font-weight: 700; letter-spacing: 1px; margin: 8px 0; }
  #reloj-tipo { font-size: 24px; color: #ffd866; }
  #etapa { font-size: 32px; font-weight: 600; }
  .botones { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; }
  button {
    font: inherit;
    font-size: 30px;
    font-weight: 700;
    padding: 18px 32px;
    border-radius: 12px;
    border: 3px solid #ffffff;
    background: #ffffff;
    color: #0b0b0d;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: wait; }
  #tick { background: #8fd3ff; border-color: #8fd3ff; }
  #reiniciar {
    margin-left: auto;
    background: #0b0b0d;
    color: #ff8a80;
    border-color: #ff8a80;
  }
  #estado { min-height: 1.4em; font-size: 28px; font-weight: 600; color: #ffd866; }
  #estado.error { color: #ff8a80; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 14px 0; border-bottom: 2px solid #3a3a40; }
  .meta { font-weight: 700; margin-right: 16px; }
  .vacio { color: #e0e0e0; font-style: italic; }
  #momentos { display: contents; }
  .columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  @media (max-width: 1100px) { .columnas { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Sala de control</h1>
<div id="reloj">—</div>
<div id="reloj-tipo"></div>
<div id="etapa"></div>

<div class="botones">
  <span id="momentos"></span>
  <button id="tick" type="button">Tick</button>
  <button id="reiniciar" type="button">Reiniciar</button>
</div>
<div id="estado" role="status"></div>

<div class="columnas">
  <section>
    <h2>Citas</h2>
    <ul id="citas"></ul>
  </section>
  <section>
    <h2>Decisiones</h2>
    <ul id="decisiones"></ul>
  </section>
</div>

<script>
  const token = new URLSearchParams(location.search).get("token") ?? "";
  const $ = (id) => document.getElementById(id);
  const fullTime = new Intl.DateTimeFormat("es-CL", {
    timeZone: "America/Santiago", weekday: "short", day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit",
  });
  const shortTime = new Intl.DateTimeFormat("es-CL", {
    timeZone: "America/Santiago", weekday: "short", hour: "2-digit", minute: "2-digit",
  });
  let busy = false;
  let renderedGuion = "";

  function setStatus(text, isError) {
    $("estado").textContent = text;
    $("estado").className = isError ? "error" : "";
  }

  function setBusy(value) {
    busy = value;
    for (const button of document.querySelectorAll("button")) button.disabled = value;
  }

  function item(meta, text) {
    const li = document.createElement("li");
    const strong = document.createElement("span");
    strong.className = "meta";
    strong.textContent = meta;
    li.append(strong, document.createTextNode(text));
    return li;
  }

  function fillList(list, rows, emptyText) {
    list.replaceChildren();
    if (rows.length === 0) {
      const li = document.createElement("li");
      li.className = "vacio";
      li.textContent = emptyText;
      list.append(li);
      return;
    }
    list.append(...rows);
  }

  function render(state) {
    $("reloj").textContent = fullTime.format(new Date(state.now));
    $("reloj-tipo").textContent = state.relojReal ? "Reloj real" : "Reloj de la demo";
    $("etapa").textContent = state.etapa === "graduada" ? "Etapa: graduada" : `Etapa ${state.etapa}`;

    // Rebuild the momento buttons only when the guion changes.
    const guionKey = JSON.stringify(state.guion);
    if (guionKey !== renderedGuion) {
      renderedGuion = guionKey;
      const buttons = state.guion.map((momento) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = momento.label;
        button.disabled = busy;
        button.addEventListener("click", () =>
          call("POST", `/sala/momentos/${encodeURIComponent(momento.id)}`, momento.label));
        return button;
      });
      $("momentos").replaceChildren(...buttons);
    }

    fillList($("citas"), [...state.citas].reverse().map((cita) =>
      item(`${cita.fecha} · ${cita.tipo} · ${cita.estado}`, cita.motivo ?? "")), "Sin citas");
    fillList($("decisiones"), [...state.decisiones].reverse().map((decision) =>
      item(`${shortTime.format(new Date(decision.at))} · ${decision.tipo}`, decision.motivo ?? "")),
      "Sin decisiones");
  }

  async function request(method, path) {
    const response = await fetch(path, { method, headers: { "x-demo-token": token } });
    let body = null;
    try { body = await response.json(); } catch { body = null; }
    if (body && body.now) render(body);
    if (!response.ok) throw new Error((body && body.error) || `Error ${response.status}`);
    return body;
  }

  async function call(method, path, label) {
    if (busy) return;
    setBusy(true);
    setStatus(`${label}…`, false);
    try {
      await request(method, path);
      setStatus("", false);
    } catch (error) {
      setStatus(error.message, true);
    } finally {
      setBusy(false);
    }
  }

  async function poll() {
    if (busy) return;
    try {
      await request("GET", "/sala/state");
      if ($("estado").className === "error" && $("estado").textContent.startsWith("Sin conexión")) {
        setStatus("", false);
      }
    } catch (error) {
      if (!busy) setStatus(`Sin conexión: ${error.message}`, true);
    }
  }

  $("tick").addEventListener("click", () => call("POST", "/sala/tick", "Tick"));
  $("reiniciar").addEventListener("click", () => {
    if (confirm("¿Reiniciar todo al punto de partida?")) call("POST", "/sala/reset", "Reiniciando");
  });

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
