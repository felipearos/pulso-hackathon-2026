<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 48px;
    background: #0b0b0d;
    color: #f5f5f5;
    font: 26px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 40px; margin: 0 0 8px; }
  h2 { font-size: 32px; margin: 40px 0 16px; }
  #reloj { font-size: 72px; font-weight: 700; letter-spacing: 1px; margin: 8px 0; }
  #reloj-tipo { font-size: 24px; color: #ffd866; }
  #etapa { font-size: 32px; font-weight: 600; }
  .botones { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; }
  button {
    font: inherit;
    font-size: 30px;
    font-weight: 700;
    padding: 18px 32px;
    border-radius: 12px;
    border: 3px solid #ffffff;
    background: #ffffff;
    color: #0b0b0d;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: wait; }
  #tick { background: #8fd3ff; border-color: #8fd3ff; }
  #reiniciar {
    margin-left: auto;
    background: #0b0b0d;
    color: #ff8a80;
    border-color: #ff8a80;
  }
  #estado { min-height: 1.4em; font-size: 28px; font-weight: 600; color: #ffd866; }
  #estado.error { color: #ff8a80; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 14px 0; border-bottom: 2px solid #3a3a40; }
  .meta { font-weight: 700; margin-right: 16px; }
  .vacio { color: #e0e0e0; font-style: italic; }
  #momentos { display: contents; }
  .columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  @media (max-width: 1100px) { .columnas { grid-template-columns: 1fr; } }
  #simulador.activo { background: #a6e3a1; border-color: #a6e3a1; }
  #simulador.apagado { background: #0b0b0d; color: #f5f5f5; }
  #chat { display: flex; flex-direction: column; gap: 16px; margin: 16px 0; }
  .burbuja { max-width: 70%; padding: 16px 20px; border-radius: 16px; border: 2px solid #3a3a40; }
  .burbuja.luna { align-self: flex-start; background: #1d2a3a; border-color: #8fd3ff; }
  .burbuja.patricia { align-self: flex-end; background: #2a2a1d; border-color: #ffd866; }
  .burbuja .meta { display: block; font-size: 22px; color: #e0e0e0; }
  .burbuja audio { width: 100%; margin: 8px 0; }
  .burbuja img { max-width: 100%; max-height: 360px; border-radius: 8px; margin: 8px 0; display: block; }
  #correos li.sospechoso {
    padding: 14px 16px;
    border: 4px solid #ff8a80;
    border-radius: 12px;
    background: #3a1414;
    font-weight: 700;
  }
  #correos li.ignorado { color: #9a9aa0; }
  #responder[hidden] { display: none; }
  #responder .fila { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin: 16px 0; }
  #responder input { font: inherit; font-size: 28px; }
  #respuesta { flex: 1; min-width: 320px; padding: 16px; border-radius: 12px; border: 3px solid #ffffff; background: #0b0b0d; color: #f5f5f5; }
</style>
</head>
<body>
<h1>Sala de control</h1>
<div id="reloj">—</div>
<div id="reloj-tipo"></div>
<div id="etapa"></div>

<div class="botones">
  <span id="momentos"></span>
  <button id="tick" type="button">Tick</button>
  <button id="reiniciar" type="button">Reiniciar</button>
</div>
<div id="estado" role="status"></div>

<div class="columnas">
  <section>
    <h2>Citas</h2>
    <ul id="citas"></ul>
  </section>
  <section>
    <h2>Decisiones</h2>
    <ul id="decisiones"></ul>
  </section>
</div>

<section>
  <h2>Correos de muestra</h2>
  <div class="botones">
    <button type="button" data-correo="banco">Banco</button>
    <button type="button" data-correo="tienda">Tienda</button>
    <button type="button" data-correo="pedido">Pedido</button>
    <button type="button" data-correo="cuotas">Cuotas</button>
    <button type="button" data-correo="pago">Pago</button>
    <button type="button" data-correo="falso">Falso del banco</button>
    <button type="button" data-correo="publicidad">Publicidad</button>
  </div>
  <ul id="correos"></ul>
</section>

<section>
  <h2>Conversación con Patricia</h2>
  <div class="botones">
    <button id="simulador" type="button">Simulador: —</button>
  </div>
  <div id="chat"></div>
  <div id="responder" hidden>
    <h2>Responder como Patricia</h2>
    <form id="responder-texto" class="fila">
      <input id="respuesta" type="text" autocomplete="off" placeholder="Escribe como Patricia" aria-label="Respuesta de Patricia">
      <button type="submit">Enviar</button>
    </form>
    <div class="fila">
      <button type="button" data-emoji="👍">👍</button>
      <button type="button" data-emoji="👌">👌</button>
      <label>Foto: <input id="foto" type="file" accept="image/*"></label>
    </div>
  </div>
</section>

<script>
  const token = new URLSearchParams(location.search).get("token") ?? "";
  const $ = (id) => document.getElementById(id);
  const fullTime = new Intl.DateTimeFormat("es-CL", {
    timeZone: "America/Santiago", weekday: "short", day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit",
  });
  const shortTime = new Intl.DateTimeFormat("es-CL", {
    timeZone: "America/Santiago", weekday: "short", hour: "2-digit", minute: "2-digit",
  });
  let busy = false;
  let renderedGuion = "";
  let renderedChat = "";
  let simuladorActivo = false;

  function setStatus(text, isError) {
    $("estado").textContent = text;
    $("estado").className = isError ? "error" : "";
  }

  function setBusy(value) {
    busy = value;
    for (const button of document.querySelectorAll("button")) button.disabled = value;
  }

  function item(meta, text) {
    const li = document.createElement("li");
    const strong = document.createElement("span");
    strong.className = "meta";
    strong.textContent = meta;
    li.append(strong, document.createTextNode(text));
    return li;
  }

  function fillList(list, rows, emptyText) {
    list.replaceChildren();
    if (rows.length === 0) {
      const li = document.createElement("li");
      li.className = "vacio";
      li.textContent = emptyText;
      list.append(li);
      return;
    }
    list.append(...rows);
  }

  function render(state) {
    $("reloj").textContent = fullTime.format(new Date(state.now));
    $("reloj-tipo").textContent = state.relojReal ? "Reloj real" : "Reloj de la demo";
    $("etapa").textContent = state.etapa === "graduada" ? "Etapa: graduada" : `Etapa ${state.etapa}`;

    // Rebuild the momento buttons only when the guion changes.
    const guionKey = JSON.stringify(state.guion);
    if (guionKey !== renderedGuion) {
      renderedGuion = guionKey;
      const buttons = state.guion.map((momento) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = momento.label;
        button.disabled = busy;
        button.addEventListener("click", () =>
          call("POST", `/sala/momentos/${encodeURIComponent(momento.id)}`, momento.label));
        return button;
      });
      $("momentos").replaceChildren(...buttons);
    }

    fillList($("citas"), [...state.citas].reverse().map((cita) =>
      item(`${cita.fecha} · ${cita.tipo} · ${cita.estado}`, cita.motivo ?? "")), "Sin citas");
    fillList($("decisiones"), [...state.decisiones].reverse().map((decision) =>
      item(`${shortTime.format(new Date(decision.at))} · ${decision.tipo}`, decision.motivo ?? "")),
      "Sin decisiones");
    fillList($("correos"), [...state.correos].reverse().map((correo) => {
      const li = item(`${shortTime.format(new Date(correo.at))} · ${correo.etiqueta}`, correo.subject);
      if (correo.tipo === "S7") li.className = "sospechoso";
      if (correo.tipo === "ignorado") li.className = "ignorado";
      return li;
    }), "Sin correos");
    renderSimulador(state.simulador);
  }

  function renderSimulador(activo) {
    simuladorActivo = Boolean(activo);
    $("simulador").textContent = simuladorActivo ? "Simulador: activo" : "Simulador: apagado";
    $("simulador").className = simuladorActivo ? "activo" : "apagado";
    $("responder").hidden = !simuladorActivo;
  }

  function withToken(url) {
    return `${url}${url.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`;
  }

  function bubble(mensaje) {
    const div = document.createElement("div");
    div.className = `burbuja ${mensaje.de}`;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `${mensaje.de === "luna" ? "Luna" : "Patricia"} · ${shortTime.format(new Date(mensaje.at))}`;
    div.append(meta);
    if (mensaje.mediaUrl && mensaje.kind === "audio") {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";
      audio.src = withToken(mensaje.mediaUrl);
      div.append(audio);
    } else if (mensaje.mediaUrl && mensaje.kind === "image") {
      const img = document.createElement("img");
      img.alt = mensaje.text ?? "Foto";
      img.src = withToken(mensaje.mediaUrl);
      div.append(img);
    }
    if (mensaje.text) {
      const text = document.createElement("div");
      text.textContent = mensaje.text;
      div.append(text);
    }
    return div;
  }

  function renderChat(conversacion) {
    renderSimulador(conversacion.simulador);
    const mensajes = conversacion.mensajes ?? [];
    // Rebuild only when the list moved, so a playing audio is not restarted.
    const chatKey = `${mensajes.length}|${mensajes.at(-1)?.at ?? ""}`;
    if (chatKey === renderedChat) return;
    renderedChat = chatKey;
    if (mensajes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "vacio";
      empty.textContent = "Sin mensajes todavía";
      $("chat").replaceChildren(empty);
      return;
    }
    $("chat").replaceChildren(...mensajes.map(bubble));
  }

  async function request(method, path, payload) {
    const headers = { "x-demo-token": token };
    let body;
    if (payload instanceof FormData) {
      body = payload;
    } else if (payload !== undefined) {
      headers["content-type"] = "application/json";
      body = JSON.stringify(payload);
    }
    const response = await fetch(path, { method, headers, body });
    let answer = null;
    try { answer = await response.json(); } catch { answer = null; }
    if (answer && answer.now) render(answer);
    if (!response.ok) throw new Error((answer && answer.error) || `Error ${response.status}`);
    return answer;
  }

  async function call(method, path, label, payload) {
    if (busy) return false;
    setBusy(true);
    setStatus(`${label}…`, false);
    try {
      await request(method, path, payload);
      setStatus("", false);
      return true;
    } catch (error) {
      setStatus(error.message, true);
      return false;
    } finally {
      setBusy(false);
    }
  }

  async function poll() {
    if (busy) return;
    try {
      await request("GET", "/sala/state");
      renderChat(await request("GET", "/sala/conversacion"));
      if ($("estado").className === "error" && $("estado").textContent.startsWith("Sin conexión")) {
        setStatus("", false);
      }
    } catch (error) {
      if (!busy) setStatus(`Sin conexión: ${error.message}`, true);
    }
  }

  $("tick").addEventListener("click", () => call("POST", "/sala/tick", "Tick"));
  $("reiniciar").addEventListener("click", () => {
    if (confirm("¿Reiniciar todo al punto de partida?")) call("POST", "/sala/reset", "Reiniciando");
  });

  for (const button of document.querySelectorAll("[data-correo]")) {
    button.addEventListener("click", () =>
      call("POST", `/sala/correos/${encodeURIComponent(button.dataset.correo)}`, `Correo: ${button.textContent}`));
  }

  $("simulador").addEventListener("click", () =>
    call("POST", "/sala/simulador", simuladorActivo ? "Apagando el simulador" : "Activando el simulador",
      { activo: !simuladorActivo }));

  async function sendMensaje(label, payload) {
    const sent = await call("POST", "/sala/simulador/mensaje", label, payload);
    if (sent) request("GET", "/sala/conversacion").then(renderChat, () => {});
    return sent;
  }

  $("responder-texto").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = $("respuesta").value.trim();
    if (!text) return;
    if (await sendMensaje("Enviando", { text })) $("respuesta").value = "";
  });
  for (const button of document.querySelectorAll("[data-emoji]")) {
    button.addEventListener("click", () => sendMensaje("Enviando", { emoji: button.dataset.emoji }));
  }
  $("foto").addEventListener("change", async () => {
    const file = $("foto").files[0];
    if (!file) return;
    const form = new FormData();
    form.append("foto", file);
    await sendMensaje("Enviando la foto", form);
    $("foto").value = "";
  });

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
